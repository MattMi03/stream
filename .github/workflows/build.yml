name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你手动点击按钮触发打包

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 获取代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Python 依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter opencv-python pillow flask requests

    - name: 使用 PyInstaller 打包
      run: |
        # --collect-all customtkinter 保证 UI 主题和字体完美打包
        pyinstaller -w -F --add-data "ffmpeg.exe;." --collect-all customtkinter app.py

    - name: 上传生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: StreamRecorder-Cloud-EXE
        path: dist/app.exe