name: Build Windows EXEs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你手动点击按钮触发打包

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 获取代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Python 依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter opencv-python pillow flask requests

    - name: 打包工具 1 - HTTP 直播流转发器
      run: |
        # 这个工具不需要 ffmpeg，纯净打包
        pyinstaller -w -F --collect-all customtkinter -n HttpStreamer app_http_stream.py

    - name: 打包工具 2 - 底层录制与云端同步工具
      run: |
        # 这个工具依赖 ffmpeg.exe 进行 24H 存盘和音频强转
        pyinstaller -w -F --add-data "ffmpeg.exe;." --collect-all customtkinter -n CloudRecorder app_record_cloud.py

    - name: 上传生成的 EXE 文件包
      uses: actions/upload-artifact@v4
      with:
        name: VideoCheck-Tools-Windows
        path: dist/*.exe