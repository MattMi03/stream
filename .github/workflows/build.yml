name: Build Windows EXEs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 获取代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Python 依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter opencv-python pillow flask requests cryptography

    - name: 打包工具 1 - HTTP/HTTPS 直播流转发器（多路）
      run: |
        pyinstaller -w -F --collect-all customtkinter -n HttpStreamer app_http_stream.py

    - name: 打包工具 2 - 底层录制与云端同步工具
      run: |
        pyinstaller -w -F --add-data "ffmpeg.exe;." --collect-all customtkinter -n CloudRecorder app_record_cloud.py

    - name: 上传 HTTP 流工具 EXE
      uses: actions/upload-artifact@v4
      with:
        name: HttpStreamer-Windows
        path: dist/HttpStreamer.exe

    - name: 上传录制工具 EXE
      uses: actions/upload-artifact@v4
      with:
        name: CloudRecorder-Windows
        path: dist/CloudRecorder.exe
