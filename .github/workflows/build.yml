name: Build Windows EXEs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 获取代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Python 依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # 新增了 flask-cors，用于支持前端跨域请求
        pip install customtkinter opencv-python pillow flask flask-cors requests cryptography

    - name: 生成自签名证书（有效期 10 年）
      run: |
        python -c "import datetime; from cryptography import x509; from cryptography.x509.oid import NameOID; from cryptography.hazmat.primitives import hashes, serialization; from cryptography.hazmat.primitives.asymmetric import rsa; private_key = rsa.generate_private_key(public_exponent=65537, key_size=2048); subject = issuer = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, 'localhost')]); cert = x509.CertificateBuilder().subject_name(subject).issuer_name(issuer).public_key(private_key.public_key()).serial_number(x509.random_serial_number()).not_valid_before(datetime.datetime.utcnow()).not_valid_after(datetime.datetime.utcnow() + datetime.timedelta(days=3650)).add_extension(x509.SubjectAlternativeName([x509.DNSName('localhost'), x509.DNSName('127.0.0.1')]), critical=False).sign(private_key, hashes.SHA256()); open('key.pem','wb').write(private_key.private_bytes(encoding=serialization.Encoding.PEM, format=serialization.PrivateFormat.PKCS8, encryption_algorithm=serialization.NoEncryption())); open('cert.pem','wb').write(cert.public_bytes(serialization.Encoding.PEM))"

    - name: 打包 HTTP 直播流转发器（多路 HTTPS + 配置保存 + HLS 音视频支持）
      run: |
        # 新增了 --add-data "ffmpeg.exe;." 以便后台 HLS 转码支持声音
        pyinstaller -w -F --add-data "cert.pem;." --add-data "key.pem;." --add-data "ffmpeg.exe;." --hidden-import cryptography --collect-all customtkinter -n HttpStreamer app_http_stream.py

    - name: 打包录制与云端同步工具（带 ffmpeg）
      run: |
        pyinstaller -w -F --add-data "cert.pem;." --add-data "key.pem;." --add-data "ffmpeg.exe;." --hidden-import cryptography --collect-all customtkinter -n CloudRecorder app_record_cloud.py

    - name: 上传 HTTP 流工具（独立下载）
      uses: actions/upload-artifact@v4
      with:
        name: HttpStreamer
        path: dist/HttpStreamer.exe

    - name: 上传录制工具（独立下载）
      uses: actions/upload-artifact@v4
      with:
        name: CloudRecorder
        path: dist/CloudRecorder.exe
